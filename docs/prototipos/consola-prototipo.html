<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Zoom do utilizador NÃO é desativado (sem maximum-scale / user-scalable=no). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consola de registo — protótipo</title>
<style>
:root {
  --bg: #f3f5f2; --surface: #ffffff; --ink: #18221c; --muted: #5b675f; --line: #d5dbd6;
  --accent: #1f7a4d; --accent-ink: #ffffff;
  --remate: #eef1ec; --falta: #e9eef7; --yellow: #f7d54a; --red: #d9473f; --gr: #e7f0fb;
  --warn: #b25b00; --ok: #1f7a4d; --lock: #fff4d6;
  --btn: 48px;               /* objetivo mínimo de alvo de toque (CSS px) */
  --gap: 6px;
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #1b221e; --ink: #e8eee9; --muted: #a3b0a7; --line: #334039;
    --remate: #26302a; --falta: #232b38; --gr: #1f2a36; --lock: #3a3320;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 15px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .45; }
.app { height: 100dvh; display: grid; grid-template-rows: auto auto auto 1fr auto;
  padding: var(--sat) var(--sar) 0 var(--sal); }

/* ---------- Cabeçalho ---------- */
.hdr { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface);
  border-bottom: 1px solid var(--line); min-height: 52px; }
.score { font-weight: 700; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.score small { font-weight: 500; color: var(--muted); font-size: 12px; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; min-width: 4.2ch; text-align: right; }
.period { font-size: 12px; color: var(--muted); white-space: nowrap; }
.fouls { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync { font-size: 12px; white-space: nowrap; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--line); }
.sync.ok { color: var(--ok); } .sync.pend { color: var(--warn); } .sync.off { color: var(--red); font-weight: 600; }
.spacer { flex: 1; }
.ibtn { min-width: var(--btn); min-height: var(--btn); border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 8px; font-size: 13px; font-weight: 600; }
.ibtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- Faixa do último evento (altura fixa: nunca desloca a lista) ---------- */
.last { display: flex; align-items: center; gap: 8px; padding: 4px 10px; min-height: 56px; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.last .txt { flex: 1; min-width: 0; font-size: 13px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.last .txt b { font-weight: 700; }
.last.mode { background: var(--lock); }

/* ---------- Corpo ---------- */
.body { min-height: 0; display: grid; }
.court, .side { min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  overflow-anchor: none; padding: 8px 10px; }
.side { border-left: 1px solid var(--line); background: var(--surface); }
.mode-tab-l .body, .mode-phone-l .body.with-side { grid-template-columns: 1fr var(--side-w, 300px); }
.mode-tab-p .body { grid-template-rows: auto auto; overflow-y: auto; }
.mode-tab-p .court, .mode-tab-p .side { overflow: visible; }
.mode-tab-p .side { border-left: 0; border-top: 1px solid var(--line); }
.mode-phone-p .side, .mode-phone-l .side { display: none; }

/* ---------- Linha / cartão de jogador ---------- */
.row { display: grid; grid-template-columns: var(--id-w, 96px) 1fr; gap: var(--gap); align-items: stretch;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; margin-bottom: 6px;
  position: relative; }
.row.gk { background: var(--gr); }
.row.vacant { grid-template-columns: 1fr; }
.idb { text-align: left; border: 0; background: transparent; padding: 2px 4px; border-radius: 8px;
  display: flex; flex-direction: column; justify-content: center; min-height: var(--btn); min-width: 0; }
.idb .l1 { display: flex; align-items: baseline; gap: 6px; }
.idb .num { font-weight: 800; font-size: 17px; }
.idb .more { margin-left: auto; color: var(--muted); font-weight: 700; }
.idb .nm { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.idb .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.acts { display: grid; gap: 4px; min-width: 0; }
.acts.two { grid-template-columns: repeat(4, minmax(var(--btn), 1fr)); grid-auto-rows: minmax(var(--btn), auto); }
.acts.one { display: flex; align-items: stretch; gap: 4px; }
.acts.one .grp { display: flex; gap: 4px; flex: var(--grow, 1) 1 0; min-width: 0; }
.acts.one .grp + .grp { margin-left: 8px; }
.glbl { display: none; }
.labels .acts.one .grp { flex-direction: column; gap: 2px; }
.labels .acts.one .grp .glbl { display: block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.labels .acts.one .grp .gbtns { display: flex; gap: 4px; flex: 1; }
.gbtns { display: contents; }
.labels .gbtns { display: flex; }
.acts.two .grp, .acts.two .gbtns { display: contents; }
.acts.two .glbl { display: none; }
.a { min-height: var(--btn); min-width: var(--btn); flex: 1 1 0; border-radius: 10px; border: 1px solid var(--line);
  background: var(--remate); font-size: 12px; font-weight: 600; padding: 2px; line-height: 1.1; overflow-wrap: normal; word-break: keep-all; hyphens: manual; -webkit-hyphens: manual; }
.mode-phone-p .a, .mode-phone-l .a { font-size: 11px; letter-spacing: -.01em; }
.a.y { background: var(--yellow); color: #3a2c00; border-color: #c9a92a; }
.a.r { background: var(--red); color: #fff; border-color: #a8322c; }
.a.f { background: var(--falta); }
.a.g { background: var(--accent); color: #fff; border-color: var(--accent); }
.a.ph { visibility: hidden; }
.a:active { filter: brightness(.9); }
.flash { animation: flash .5s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }

/* bloqueio curto após substituição */
.outbtn { min-height: var(--btn); border-radius: 10px; border: 2px dashed var(--red); background: var(--surface);
  font-weight: 700; color: var(--red); width: 100%; }
.vacbtn { min-height: var(--btn); border-radius: 10px; border: 2px dashed var(--line); background: transparent; width: 100%;
  color: var(--muted); font-weight: 600; }

/* ---------- Doca (telemóvel vertical) ---------- */
.dock { display: none; gap: 6px; padding: 6px 10px calc(6px + var(--sab)); background: var(--surface); border-top: 1px solid var(--line); }
.dock .ibtn { flex: 1; }
.mode-phone-p .dock { display: flex; }
.app.mode-phone-l { grid-template-columns: auto minmax(0, 1fr) 72px; grid-template-rows: 56px minmax(0, 1fr);
  grid-template-areas: "hdr last dock" "body body dock"; padding-bottom: var(--sab); }
.mode-phone-l .hdr { grid-area: hdr; border-right: 1px solid var(--line); }
.mode-phone-l .last { grid-area: last; }
.mode-phone-l .body { grid-area: body; }
.mode-phone-l .dock { grid-area: dock; display: flex; flex-direction: column; padding: 6px; border-top: 0; border-left: 1px solid var(--line); }
.mode-phone-l .dock .ibtn { flex: 0 0 auto; padding: 0 2px; font-size: 12px; }
.mode-phone-l .app-pad-b { display: none; }
.mode-phone-l .hdr .cfgbtn { display: none; }
.dock .cfgbtn { display: none; } .mode-phone-l .dock .cfgbtn, .mode-phone-p .dock .cfgbtn { display: block; }
.mode-phone-p .hdr .cfgbtn { display: none; }   /* iPhone vertical: ⚙ passa para a doca, para o cronómetro maior caber */
.mode-phone-p .dock .cfgbtn { flex: 0 0 var(--btn); }
/* Tablet horizontal: cabeçalho e último evento na mesma faixa, para as 5 linhas caberem com a barra de equipa */
.app.mode-tab-l { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas: "hdr last" "team team" "body body"; padding-bottom: var(--sab); }
.mode-tab-l .hdr { grid-area: hdr; border-right: 1px solid var(--line); }
.mode-tab-l .hdr .spacer { flex: 0 0 12px; }
.mode-tab-l .last { grid-area: last; height: auto; }
.mode-tab-l .teambar { grid-area: team; }
.mode-tab-l .body { grid-area: body; }
.mode-tab-l .app-pad-b { display: none; }
.mode-phone-l .court { padding: 4px 8px; }
.mode-phone-l .row { padding: 3px; margin-bottom: 4px; }
.mode-phone-l .idb { padding: 0 4px; }
.meta-inline { display: none; font-size: 11px; color: var(--muted); font-weight: 500; }
.mode-phone-l .meta-inline { display: inline; }
.mode-phone-l .meta-block { display: none; }
.mode-phone-l .app-pad-b, .mode-tab-l .app-pad-b, .mode-tab-p .app-pad-b { height: var(--sab); }

/* ---------- Painel de equipa ---------- */
.side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 6px; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.tgrid .ibtn { width: 100%; }
.tag009 { font-size: 10px; color: var(--muted); font-weight: 500; }
.bench { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.bchip { min-height: var(--btn); border-radius: 10px; border: 1px solid var(--line); background: var(--bg); text-align: left; padding: 4px 8px; }
.bchip b { font-weight: 800; } .bchip.sel { outline: 3px solid var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg .ibtn.on { background: var(--accent); color: #fff; }

/* ---------- Folha (sheet) ---------- */
.sheetwrap { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
.sheetwrap.open { display: flex; }
.sheet { background: var(--surface); width: min(640px, 100%); max-height: 88dvh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 12px 12px calc(12px + var(--sab)); padding-left: max(12px, var(--sal)); padding-right: max(12px, var(--sar)); }
.sheet h2 { font-size: 16px; margin: 4px 0 8px; }
.sheet h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 6px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.chips .ibtn.on, .zgrid .ibtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.zgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.sheet .actionsrow { display: flex; gap: 8px; margin-top: 12px; position: sticky; bottom: 0; background: var(--surface); padding-top: 8px; }
.sheet .actionsrow .ibtn { flex: 1; }
.note { font-size: 12px; color: var(--muted); }
.cfg label { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--btn); }
.cfg select { min-height: 40px; font: inherit; }
.clock.stopped { color: var(--warn); }
/* Contadores por categoria de equipa */
.cnt { display: block; font-size: 11px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.ibtn.gkon .cnt, .ibtn.primary .cnt { color: inherit; }
.tgrp { display: grid; grid-template-columns: minmax(0, 1fr) var(--btn); gap: 4px; min-width: 0; }
.ibtn.minus { font-size: 22px; font-weight: 700; padding: 0; min-width: var(--btn); }
.pr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pr h4 { margin: 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.pr .col { display: grid; gap: 6px; align-content: start; }
.ibtn.perda { border-color: #c4524b; } .ibtn.recup { border-color: var(--accent); }
/* Barra de equipa no topo */
.teambar { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; padding: 6px 10px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.teambar .ibtn { width: 100%; padding: 0 4px; line-height: 1.1; }
.mode-phone-l .teambar { display: none; }
.mode-tab-p .teambar { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }   /* tablet vertical: 2 filas de 3, sem cortar texto */
.mode-phone-p #dock [data-act="open-team"] { display: none; }   /* no iPhone vertical, "Mais…" na barra de equipa substitui "Equipa" */
.mode-phone-p.gk-on #dock [data-act="open-team"] { display: block; }   /* GR-linha ativo ocupa o lugar de "Mais…": passa para a doca */
.ibtn.gkon { background: var(--warn); color: #fff; border-color: var(--warn); }
.gkchip { font-size: 12px; font-weight: 700; color: #fff; background: var(--warn); border-radius: 999px; padding: 3px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* Cronómetro maior */
.clock { font-size: 24px; }
.labels .clock { font-size: 34px; }
.mode-phone-l .clock { font-size: 24px; }
/* Zona rápida: painel NÃO modal (sem fundo escurecido), fixo, não desloca a lista */
.zq { position: fixed; z-index: 40; right: max(8px, var(--sar)); bottom: calc(8px + var(--sab)); width: min(420px, calc(100vw - 16px));
  background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.mode-phone-p .zq { bottom: var(--sab); left: max(6px, var(--sal)); right: max(6px, var(--sar)); width: auto; }
.quadra { display: flex; align-items: stretch; gap: 4px; margin-top: 4px; }
.quadra .gside { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; color: var(--muted); text-align: center;
  border-right: 3px solid var(--muted); padding-right: 2px; }
.quadra .gside:last-child { transform: none; border-right: 0; border-left: 3px solid var(--muted); padding: 0 0 0 2px; }
.quadra .q4 { flex: 1; display: grid; grid-template-columns: 1fr 1fr 2px 1fr 1fr; gap: 4px; }
.quadra .q4 .ibtn { min-height: var(--btn); min-width: 0; }
.quadra .mid { border-left: 2px dashed var(--muted); }
.ataque { text-align: center; font-size: 11px; color: var(--muted); margin-top: 2px; }
.sheet .goal { text-align: center; font-size: 11px; color: var(--muted); margin: 2px 0; }
.zq .goalside { display: flex; align-items: stretch; gap: 4px; }
.zq .goalside .zgrid { flex: 1; }
.zq .goalbar { writing-mode: vertical-rl; font-size: 11px; color: var(--muted); text-align: center; border-left: 3px solid var(--muted); padding-left: 2px; }
.mode-phone-l .zq { right: calc(80px + var(--sar)); }
.zq .zqh { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.zq .zqh span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.zq .goal { text-align: center; font-size: 11px; color: var(--muted); margin: 2px 0; }
.zq .zgrid .ibtn { min-height: 44px; }
.mode-phone-p .zq .zgrid .ibtn, .labels .zq .zgrid .ibtn { min-height: var(--btn); }
.mode-phone-l .zq { width: 340px; bottom: calc(4px + var(--sab)); padding: 4px; }
.mode-phone-l .zq .zgrid { gap: 4px; }
.mode-phone-l .zq .zgrid .ibtn { min-height: 48px; }
/* Resumo rápido */
.stats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats th, .stats td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.stats th:first-child, .stats td:first-child { text-align: left; }
.stats td:last-child { width: calc(var(--btn) + 8px); padding: 2px 0 2px 8px; }
.stats tr.sub td:first-child { padding-left: 16px; color: var(--muted); }
.qstats { font-size: 13px; background: var(--bg); border-radius: 10px; padding: 8px; margin-top: 4px; }
.qstats b { font-variant-numeric: tabular-nums; }
/* iPhone vertical: o cabeçalho tem de caber em ~390 px — espaços menores e o estado de sincronização pode partir em 2 linhas */
.mode-phone-p .hdr { gap: 5px; padding: 4px 8px; }
.mode-phone-p .sync { white-space: normal; text-align: center; line-height: 1.1; min-width: 0; flex: 0 1 auto; padding: 3px 6px; }
.mode-phone-p .score { font-size: 17px; }
/* Reforço visual (opção do protótipo, só no tablet): 1 = texto maior + negrito; 2 = idem + alvos de 64 px */
.app.rf.labels .a { font-weight: 800; font-size: 16px; }
.app.rf.labels .idb .num { font-size: 21px; }
.app.rf.labels .idb .nm { font-size: 15px; }
.app.rf.labels .glbl { font-size: 11px; font-weight: 700; }
.cfg details { border-top: 1px solid var(--line); margin-top: 8px; }
.cfg summary { min-height: var(--btn); display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.hist, .tasks { margin: 4px 0 8px; padding-left: 22px; font-size: 13px; }
.hist { max-height: 40dvh; overflow-y: auto; }
.hist li, .tasks li { margin: 2px 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr" id="hdr"></header>
  <div class="teambar" id="teambar"></div>
  <div class="last" id="last"></div>
  <main class="body" id="body">
    <section class="court" id="court" aria-label="Jogadores em quadra"></section>
    <aside class="side" id="side" aria-label="Equipa e banco"></aside>
  </main>
  <nav class="dock" id="dock" aria-label="Ações gerais">
    <button class="ibtn" data-act="open-team">Equipa</button>
    <button class="ibtn" data-act="open-bench">Substituir</button>
    <button class="ibtn" data-act="summary">Resumo</button>
    <button class="ibtn" data-act="pause" id="dockPause">Pausa</button>
    <button class="ibtn cfgbtn" data-act="cfg" aria-label="Definições do protótipo">⚙</button>
  </nav>
  <div class="app-pad-b"></div>
  <div class="zq" id="zq" hidden></div>
</div>
<div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";
/* Protótipo de interação — dados FICTÍCIOS, estado só em memória, sem rede, sem Supabase.
   Taxonomia: eventos existentes + tipos propostos na spec 009 (não implementados na app). */

// ---------- Simulação de safe areas (só para medição): ?safe=top,right,bottom,left ----------
(function () {
  const q = new URLSearchParams(location.search);
  const s = q.get("safe");
  if (s) {
    const [t, r, b, l] = s.split(",").map((x) => (parseFloat(x) || 0) + "px");
    const st = document.documentElement.style;
    st.setProperty("--sat", t); st.setProperty("--sar", r); st.setProperty("--sab", b); st.setProperty("--sal", l);
  }
  if (q.get("density")) window.__density = q.get("density");
  if (q.get("rf") != null) window.__rf = +q.get("rf");
})();

const ROSTER = [
  { id: "p1", num: "1", name: "Tiago Ramos", pos: "GR", gk: true },
  { id: "p10", num: "10", name: "Martim S.", pos: "AE" },
  { id: "p7", num: "7", name: "Francisco Albuquerque", pos: "AD" },
  { id: "p4", num: "4", name: "Rui Lopes", pos: "FX" },
  { id: "p9", num: "9", name: "Duarte Mendes", pos: "PV" },
  { id: "p12", num: "12", name: "Gonçalo Pires", pos: "GR", gk: true },
  { id: "p5", num: "5", name: "João Costa", pos: "FX" },
  { id: "p8", num: "8", name: "Lourenço Faria", pos: "AE" },
  { id: "p11", num: "11", name: "Henrique Sá", pos: "AD" },
  { id: "p14", num: "14", name: "Vasco Teixeira", pos: "PV" },
];
const byId = Object.fromEntries(ROSTER.map((p) => [p.id, p]));
const TIPOS = [["org","ORG Organização"],["trs","TRS Transição"],["atr","ATR Ataque rápido"],["cnt","CNT Canto"],["lat","LAT Lateral"],
  ["lvr","LVR Livre"],["pnt","PNT Penálti"],["l10","L10 Livre 10 m"],["gll","GLL Goleiro-linha"],["ppb","PPB Própria baliza"]];
const LABEL = {
  golo: "Golo", remate_defendido: "Remate defendido", remate_fora: "Remate fora", remate_bloqueado: "Remate bloqueado",
  cartao_amarelo: "Cartão amarelo", cartao_vermelho: "Cartão vermelho", falta: "Falta feita", falta_sofrida: "Falta recebida",
  defesa: "Remate deles defendido (GR)", saida_ganha: "Saída 1x1 ganha", saida_perdida: "Saída 1x1 perdida", golo_sofrido: "Golo sofrido",
  substituicao: "Substituição", entrada: "Entrada (vaga)", pausa: "Pausa", fim_pausa: "Fim de pausa", lesao_inicio: "Atendimento iniciado",
  lesao_fim: "Atendimento terminado", fim_periodo: "Fim de parte", perda: "Perda de bola", recuperacao: "Recuperação de bola",
  remate_adv_fora: "Remate deles fora", remate_adv_bloqueado: "Remate deles bloqueado",

// ---------- Estado ----------
// O relógio vive FORA do estado de jogo: desfazer um evento nunca faz recuar o tempo decorrido.
const CLOCK = { ms: 0, running: true, lastTick: Date.now() };
function initialState() {
  return {
    slots: ["p1", "p10", "p7", "p4", "p9"],      // posição FIXA das linhas; quem entra herda a linha de quem sai

function resetClock() { CLOCK.ms = 14 * 60000 + 32000; CLOCK.running = true; CLOCK.lastTick = Date.now(); }
let S = initialState();
resetClock();
const UI = {
  density: window.__density || "B",
  reinforce: window.__rf != null ? window.__rf : 2,   // 2 = automático: o maior botão que ainda deixa as 5 linhas visíveis (≥ 48); 0 = normal
  offline: false, pending: 0, syncing: false, expanded: null, taps: 0,
  // Fluxo transitório ÚNICO (substituição / vaga). null = nenhum. Nunca sobrevive a um cancelamento.
  //   { kind: "pick-out", inId }      — escolhido quem entra; falta tocar SAI numa linha
  //   { kind: "pick-in", outId }      — escolhido quem sai (a partir da linha); falta escolher quem entra
  //   { kind: "vacancy", slot, inId } — vaga por vermelho; escolher e CONFIRMAR quem entra
  flow: null,
  notice: null,              // aviso na faixa do último evento (ex.: "Anulada: …")

  sheetKind: null,           // tipo da folha aberta; "flow" = pertence ao fluxo em curso
  confirmReset: false,

let epoch = 0;               // muda em cada reinício: callbacks de temporizadores antigos ficam sem efeito
const BOUNDARY = new Set(["fim_periodo", "kickoff"]);   // limites de parte: não se desfazem neste protótipo
let undoStack = [];
const snap = () => JSON.parse(JSON.stringify(S));

function addEvent(type, pid, extra) {
  if (BOUNDARY.has(type)) undoStack = [];       // o desfazer não atravessa um limite de parte
  else { undoStack.push(snap()); if (undoStack.length > 50) undoStack.shift(); }
  const ev = { id: Math.random().toString(36).slice(2), type, pid: pid || null, t: CLOCK.ms, period: S.period, ...(extra || {}) };
  S.events.push(ev);
  UI.pending++; scheduleSync();
  return ev;
}
function canUndo() { return undoStack.length > 0 && !UI.flow; }
function undo() {
  if (!canUndo()) return;
  S = undoStack.pop();                           // o relógio (CLOCK) não é restaurado: o tempo decorrido mantém-se
  UI.pending = Math.max(0, UI.pending - 1);
  UI.expanded = null; UI.zq = null; UI.notice = null;
  renderAll();
}
let syncTimer = null;
function scheduleSync() {
  if (UI.offline || syncTimer) return renderHeader();
  UI.syncing = true; renderHeader();
  const myEpoch = epoch;
  syncTimer = setTimeout(() => {
    syncTimer = null;
    if (myEpoch !== epoch) return;
    UI.syncing = false; if (!UI.offline) UI.pending = 0; renderHeader();
  }, 2500);
}

// ---------- Layout por viewport efetivo ----------
let MODE = "";
function computeMode() {
  const w = innerWidth, h = innerHeight;
  let mode;
  if (w < 600) mode = "phone-p";
  else if (h < 500) mode = "phone-l";
  else if (w >= h) mode = "tab-l";
  else mode = "tab-p";
  const app = document.getElementById("app");
  app.className = "app mode-" + mode + (mode === "tab-l" || mode === "tab-p" ? " labels" : "") + (UI.reinforce ? " rf" : "") + (S.gkLine ? " gk-on" : "");
  const r = document.documentElement.style;
  // tamanhos de alvo: nunca abaixo de 48; maiores no tablet
  const auto = UI.reinforce === 2;
  const btn = mode.startsWith("tab") ? (auto ? 64 : 56) : (auto && mode === "phone-p" && UI.density === "B" ? 64 : 48);
  r.setProperty("--btn", btn + "px");
  r.setProperty("--id-w", mode === "phone-p" ? "96px" : mode === "phone-l" ? "164px" : "168px");
  r.setProperty("--side-w", w >= 1100 ? "320px" : "264px");
  MODE = mode;
}
function actsLayout() {
  // Uma linha só se couberem 8 alvos de --btn mais identificação; senão, duas filas de 4 (sem encolher alvos).
  if (MODE === "phone-p") return "two";
  const btn = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--btn"));
  const court = document.getElementById("court");
  const idw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--id-w"));
  const n = UI.density === "A" ? 8 : 5;
  const need = idw + 6 + n * btn + (n - 1) * 4 + 3 * 8 + 12 + 20;
  if (court.clientWidth >= need) return "one";
  if (MODE.startsWith("tab") && btn > 48) {   // reduz por degraus (…→56→48, nunca abaixo de 48) antes de partir em duas filas
    for (const b of [56, 48].filter((x) => x < btn)) {
      const needB = idw + 6 + n * b + (n - 1) * 4 + 3 * 8 + 12 + 20;
      if (court.clientWidth >= needB) { document.documentElement.style.setProperty("--btn", b + "px"); return "one"; }
    }
  }
  return "two";
}

const PLAYER_EVENTS = new Set(["remate_defendido","remate_fora","remate_bloqueado","falta","falta_sofrida","defesa","saida_ganha","saida_perdida","cartao_amarelo","cartao_vermelho"]);
function flashRow(pid) {

function doPlayerEvent(type, pid) {
  if (!S.slots.includes(pid)) return;            // ação de uma folha antiga para alguém que já não está em quadra
  addEvent(type, pid);
  if (type === "falta") S.foulsNos++;
  if (type === "cartao_amarelo") (S.cards[pid] = S.cards[pid] || {}).y = true;
  if (type === "cartao_vermelho") { (S.cards[pid] = S.cards[pid] || {}).r = true; S.slots = S.slots.map((x) => (x === pid ? null : x)); }
  UI.expanded = null;
  const ev = S.events[S.events.length - 1];
  UI.zq = ZONA_OK.has(type) ? { evId: ev.id } : null;
  closeSheet(); renderAll(); flashRow(pid);
}
/** Conclusão legítima de uma substituição: valida, regista, limpa o fluxo e só depois fecha a folha. */
function completeSub(outId, inId) {
  const slot = S.slots.indexOf(outId);
  UI.flow = null;
  if (slot < 0 || !S.bench.includes(inId)) { closeSheet(); return renderAll(); }   // estado mudou entretanto: não consome nada
  addEvent("substituicao", inId, { out: outId });
  S.slots[slot] = inId;
  S.bench = S.bench.filter((x) => x !== inId).concat(outId);
  closeSheet(); renderAll();
}
function resetScenario() {

  clearTimeout(syncTimer); syncTimer = null;

  goalDraft = null; transDraft = null;
  closeSheet(); renderAll();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, pid = b.dataset.pid;
  if (UI.zq && !act.startsWith("zq-") && act !== "cfg") { UI.zq = null; renderZq(); }
  if (UI.notice && act !== "cfg") { UI.notice = null; if (act !== "undo" && act !== "minus") renderLast(); }
  if (ADV_SHOTS.has(act)) {
    const ev = addEvent(act, null); UI.expanded = null; UI.zq = { evId: ev.id }; closeSheet(); return renderAll();
  }
  if (PLAYER_EVENTS.has(act)) return doPlayerEvent(act, pid);
  switch (act) {
    case "golo": if (!S.slots.includes(pid)) return; goalDraft = { side: "nos", pid, tipo: null, assist: undefined, zona: null }; return goalSheet();
    case "golo_sofrido": UI.expanded = null; goalDraft = { side: "adv", tipo: null, zona: null }; return goalSheet();
    case "g-tipo": goalDraft.tipo = goalDraft.tipo === b.dataset.v ? null : b.dataset.v; return goalSheet();
    case "g-assist": goalDraft.assist = b.dataset.v || null; return goalSheet();
    case "g-zona": goalDraft.zona = +b.dataset.v === goalDraft.zona ? null : +b.dataset.v; return goalSheet();
    case "g-confirm": {
      const d = goalDraft; goalDraft = null;
      if (!d) return closeSheet();
      if (d.side === "nos") { addEvent("golo", d.pid, { tipo: d.tipo, assist: d.assist || null, zona: d.zona }); S.score.nos++; }
      else { addEvent("golo_sofrido", null, { tipo: d.tipo, zona: d.zona }); S.score.adv++; }
      closeSheet(); renderAll(); if (d.pid) flashRow(d.pid); return;
    }
    case "expand": UI.expanded = pid; return renderCourt();
    case "collapse": UI.expanded = null; return renderCourt();
    case "open-player": return playerSheet(pid);
    case "treat-start": addEvent("lesao_inicio", pid); S.treatment = pid; closeSheet(); return renderAll();
    case "treat-end": addEvent("lesao_fim", pid); S.treatment = null; closeSheet(); return renderAll();
    // ----- Substituições: um fluxo de cada vez; qualquer fluxo novo substitui explicitamente o anterior -----
    case "sub-from-row": UI.flow = { kind: "pick-in", outId: pid }; renderAll(); return pickInSheet();
    case "open-bench":
      UI.flow = null; renderAll();
      return openSheet(benchHTML("Quem entra?") + `<p class="note">Depois toca em SAI na linha de quem sai.</p><div class="actionsrow"><button class="ibtn" data-act="close">Fechar</button></div>`, "bench");
    case "bench": {
      const f = UI.flow;
      if (f && f.kind === "pick-in") return completeSub(f.outId, pid);
      if (f && f.kind === "vacancy") { f.inId = pid; return vacancySheet(); }   // escolher não é confirmar
      UI.flow = { kind: "pick-out", inId: pid }; closeSheet(); return renderAll();
    }
    case "sub-out": {
      const f = UI.flow;
      if (!f || f.kind !== "pick-out") return;
      return completeSub(S.slots[+b.dataset.slot], f.inId);
    }
    case "vacancy": UI.flow = { kind: "vacancy", slot: +b.dataset.slot, inId: null }; renderAll(); return vacancySheet();
    case "vacancy-confirm": {
      const f = UI.flow;
      if (!f || f.kind !== "vacancy" || !f.inId) return;
      UI.flow = null;
      if (S.slots[f.slot] !== null || !S.bench.includes(f.inId)) { closeSheet(); return renderAll(); }
      addEvent("entrada", f.inId); S.slots[f.slot] = f.inId; S.bench = S.bench.filter((x) => x !== f.inId);
      closeSheet(); return renderAll();
    }
    case "cancel-flow": return cancelFlow();
    case "open-team": return openSheet(teamPanelHTML() + `<div class="actionsrow"><button class="ibtn" data-act="close">Fechar</button></div>`, "team");
    case "pause":
      if (!CLOCK.running) return;
      if (S.pause) { addEvent("fim_pausa", null); S.pause = null; closeSheet(); return renderAll(); }
      return openSheet(`<h2>Pausa — motivo</h2><div class="tgrid">
        <button class="ibtn" data-act="pause-go" data-v="tempo_nos">Pedido de tempo (nós)</button>
        <button class="ibtn" data-act="pause-go" data-v="tempo_advers">Pedido de tempo (adv.)</button>
        <button class="ibtn" data-act="pause-go" data-v="outro">Outro motivo</button></div>
        <div class="actionsrow"><button class="ibtn" data-act="close">Cancelar</button></div>`, "pause");
    case "pause-go": addEvent("pausa", null, { reason: b.dataset.v }); S.pause = b.dataset.v; closeSheet(); return renderAll();
    case "end-period":
      return openSheet(`<h2>Terminar a ${S.period}ª parte?</h2><p class="note">O relógio para. A parte seguinte só começa quando tocares em "Iniciar parte".</p>
        <div class="actionsrow"><button class="ibtn" data-act="close">Cancelar</button><button class="ibtn primary" data-act="end-period-go">Terminar parte</button></div>`, "end");
    case "end-period-go":
      if (!CLOCK.running) return closeSheet();
      if (S.pause) { addEvent("fim_pausa", null); S.pause = null; }   // pausa em curso fecha-se ao terminar a parte
      addEvent("fim_periodo", null);
      CLOCK.running = false;
      S.period++; S.foulsNos = 0; S.foulsAdv = 0;
      closeSheet(); return renderAll();
    case "kickoff":
      if (CLOCK.running) return;
      CLOCK.ms = 0; CLOCK.running = true; CLOCK.lastTick = Date.now();
      addEvent("kickoff", null); closeSheet(); return renderAll();
    case "gkline":
      addEvent(S.gkLine ? "goleiro_linha_fim" : "goleiro_linha_inicio", null, S.gkLine ? { durSec: Math.round((CLOCK.ms - S.gkLineStart) / 1000) } : {});
      S.gkLine = !S.gkLine; if (S.gkLine) S.gkLineStart = CLOCK.ms;
      closeSheet(); return renderAll();
    case "transicao": transDraft = { dir: b.dataset.dir }; return transSheet();
    case "t-quick": if (!transDraft) return closeSheet(); addEvent("transicao", null, { dir: transDraft.dir, res: b.dataset.res, num: b.dataset.num }); transDraft = null; closeSheet(); return renderAll();
    case "summary": return openSheet(summaryHTML(), "summary");
    case "pr": addEvent(b.dataset.kind === "p" ? "perda" : "recuperacao", null, { z3: b.dataset.z }); renderAll(); if (UI.sheetKind === "team") openSheet(teamPanelHTML() + `<div class="actionsrow"><button class="ibtn" data-act="close">Fechar</button></div>`, "team"); return;
    case "minus": {
      // Anula o último evento DESTA categoria (pode não ser o último do jogo). Desfazível com "Desfazer".
      const cat = TEAM_CATS[b.dataset.cat]; if (!cat) return;
      let idx = -1; for (let k = S.events.length - 1; k >= 0; k--) if (cat.match(S.events[k])) { idx = k; break; }
      if (idx < 0) return;
      undoStack.push(snap());
      const [ev] = S.events.splice(idx, 1);
      if (ev.type === "golo_sofrido") S.score.adv = Math.max(0, S.score.adv - 1);
      UI.pending++; scheduleSync();
      const det = ev.type === "transicao" ? ` ${ev.num}` : "";
      UI.notice = `Anulado: <b>${cat.label}${det}</b> (${ev.period}ª ${fmt(ev.t)})`;
      renderAll();
      if (UI.sheetKind === "team") openSheet(teamPanelHTML() + `<div class="actionsrow"><button class="ibtn" data-act="close">Fechar</button></div>`, "team");
      if (UI.sheetKind === "summary") openSheet(summaryHTML(), "summary");
      return;
    }
    case "zq-set": { const ev = UI.zq && S.events.find((x) => x.id === UI.zq.evId); if (ev) ev.zona = +b.dataset.v; UI.zq = null; renderZq(); return renderLast(); }
    case "zq-close": UI.zq = null; return renderZq();
    case "zona-last": { const ev = S.events[S.events.length - 1]; if (ev && ZONA_OK.has(ev.type)) { UI.zq = { evId: ev.id }; renderZq(); renderLast(); } return; }
    case "undo": return undo();
    case "cfg": UI.confirmReset = false; return cfgSheet();
    case "tap-reset": UI.taps = 0; return cfgSheet("eval");
    case "reset-ask": UI.confirmReset = true; return cfgSheet("eval");
    case "reset-cancel": UI.confirmReset = false; return cfgSheet("eval");
    case "reset-go": return resetScenario();
    case "close": return dismissSheet();
  }
});
$("sheetwrap").addEventListener("click", (e) => { if (e.target === $("sheetwrap")) dismissSheet(); });
document.addEventListener("change", (e) => {
  const c = e.target.dataset.cfg;
  if (c === "density") { UI.density = e.target.value; UI.expanded = null; renderAll(); }
  if (c === "rf") { UI.reinforce = +e.target.value; renderAll(); }
  if (c === "offline") { UI.offline = e.target.checked; if (!UI.offline) scheduleSync(); else renderHeader(); }
});
// Contador de ativações: cada ativação (toque, clique ou teclado) de um botão da consola; exclui o painel do protótipo.
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.act === "cfg" || b.closest(".cfg") || (UI.sheetKind === "cfg" && b.closest("#sheet"))) return;
  UI.taps++;
}, true);

// ---------- Relógio: só altera texto de largura fixa; nunca re-renderiza a lista ----------
setInterval(() => {
  const now = Date.now();
  if (CLOCK.running) CLOCK.ms += now - CLOCK.lastTick;   // a pausa não para o relógio (como na app); o fim de parte para
  CLOCK.lastTick = now;
  const c = $("clock"); if (c) c.textContent = fmt(CLOCK.ms);
  if (S.gkLine) document.querySelectorAll("[data-gkl]").forEach((x) => (x.textContent = fmt(Math.max(0, CLOCK.ms - S.gkLineStart))));
}, 250);
let rT = null;
addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(renderAll, 80); });
renderAll();
</script>
</body>
</html>
